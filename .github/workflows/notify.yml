name: 비서 알림

on:
  schedule:
    - cron: '3 23 * * *' # 매일 오전 8시 3분 (한국 시간, 정각은 붐벼서 비켜 둠)
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 바로 실행 가능

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      # 브리핑 직전에 일정·할일을 새로 받아요 (자동 동기화를 켠 경우만, 실패해도 브리핑은 보내요)
      - run: node scripts/agenda-sync.mjs
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - run: node scripts/notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
