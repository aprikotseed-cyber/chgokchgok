name: 비서 알림

on:
  schedule:
    - cron: '33 22 * * *' # 매일 오전 7시 33분 (한국 시간). 예비용: 제시간은 cron-job.org가 7시 30분에 실행해요
  workflow_dispatch:      # Actions 탭 'Run workflow' 또는 cron-job.org·앱에서 실행
    inputs:
      test:
        description: '브리핑 대신 시험 알림만 보내기'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      # 브리핑 직전에 일정·할일을 새로 받아요 (자동 동기화를 켠 경우만, 실패해도 브리핑은 보내요)
      - run: node scripts/agenda-sync.mjs
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NAVER_CALDAV_ID: ${{ secrets.NAVER_CALDAV_ID }}
          NAVER_CALDAV_PASSWORD: ${{ secrets.NAVER_CALDAV_PASSWORD }}
      - run: node scripts/notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ inputs.test }}
