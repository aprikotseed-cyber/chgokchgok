name: 비서 알림

on:
  schedule:
    - cron: '3 23 * * *' # 매일 오전 8시 3분 (한국 시간, 정각은 붐벼서 비켜 둠)
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 바로 실행 가능

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
