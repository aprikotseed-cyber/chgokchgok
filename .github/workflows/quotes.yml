name: 주가·환율 장중 업데이트

# 국내장이 열려 있는 평일에 1시간마다 주가와 환율만 가져와요.
# 미국 주식은 '시세 자동 업데이트'가 아침에 한 번, 미국장 마감 가격으로 받아요. (주택 실거래가도 아침에 한 번)
# GitHub 예약 실행은 UTC 기준이고, 몇 분~십여 분 늦게 시작될 수 있어요.
# 정각(0분)은 전 세계 예약이 몰려 늦거나 건너뛰는 일이 많아서, 일부러 13분·43분·23분처럼 비켜 두었어요.
on:
  schedule:
    - cron: '13 0-6 * * 1-5'   # 국내장: 오전 9시 13분 ~ 오후 3시 13분, 1시간마다 (한국 시간)
    - cron: '43 6 * * 1-5'     # 국내장 마감 뒤 오후 3시 43분
  workflow_dispatch: {}

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/update-market.mjs
        env:
          MODE: quotes
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
