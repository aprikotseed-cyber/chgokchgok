<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>차곡차곡</title>
  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="차곡차곡">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261110a">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js?v=20261110a"></script>
</head>
<body>
  <div id="boot" class="boot">불러오는 중</div>

  <main id="login" class="login" hidden>
    <form id="login-form" class="login-form">
      <img class="login-logo" src="logo-mark.png" alt="" width="84" height="84">
      <h1>차곡차곡</h1>
      <p class="hint">나만 보는 자산 장부</p>
      <label class="field"><span>이메일</span><input id="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>비밀번호</span><input id="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="warn" role="alert"></p>
      <button class="btn primary wide" type="submit">로그인</button>
      <a class="hint" href="?demo">예시 데이터로 둘러보기</a>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <!-- 휴대폰: 위쪽 머리줄 + 아래 탭바 / PC: 왼쪽 사이드바 하나 -->
    <header class="top">
      <a class="brand" href="#home"><img src="logo-mark.png" alt="" width="24" height="24">차곡차곡</a>
      <div class="top-right">
        <span class="sync" aria-live="polite"></span>
        <button class="icon-btn assistant-open" type="button" aria-label="비서에게 물어보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></button>
        <a class="icon-btn" href="#settings" data-tab="settings" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></a>
      </div>
    </header>
    <aside class="side">
      <a class="brand side-brand" href="#home"><img src="logo-mark.png" alt="" width="26" height="26">차곡차곡</a>
    <nav class="tabs" aria-label="메뉴">
      <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>홈</span></a>
      <a href="#assets" data-tab="assets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5M5 9v11h14V9"/></svg><span>자산</span></a>
      <a href="#debts" data-tab="debts"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg><span>부채</span></a>
      <a href="#fixed" data-tab="fixed"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>고정지출</span></a>
      <a href="#records" data-tab="records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>기록</span></a>
    </nav>
      <div class="side-foot">
        <button class="side-link assistant-open" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg><span>비서에게 물어보기</span></button>
        <a class="side-link" href="#settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span>설정</span></a>
        <span class="sync"></span>
      </div>
    </aside>
    <main id="view" class="view"></main>
  </div>

  <dialog id="assistant" class="assistant" aria-label="비서">
    <header class="as-head">
      <div><h2>비서</h2><p class="hint">입력해 두신 내용으로만 답해요</p></div>
      <button type="button" class="icon-btn" id="assistant-close" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div id="as-log" class="as-log" aria-live="polite" tabindex="-1" autofocus></div>
    <form id="as-form" class="as-form">
      <input id="as-input" type="text" placeholder="예: 보금자리 다음 상환 언제야?" autocomplete="off" enterkeyhint="send">
      <button class="btn primary" type="submit" aria-label="보내기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </dialog>

  <div id="alerts" class="alerts" aria-live="polite"></div>
  <div id="update" class="update" role="status" hidden>
    <span>새 버전이 있어요</span>
    <button id="update-apply" class="link-btn">바로 적용</button>
  </div>

  <dialog id="editor">
    <form id="editor-form">
      <h2 id="editor-title"></h2>
      <div id="editor-fields"></div>
      <div class="dialog-actions">
        <button type="button" id="editor-delete" class="btn danger">삭제</button>
        <span class="spacer"></span>
        <button type="button" id="editor-cancel" class="btn">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
