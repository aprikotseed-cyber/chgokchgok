<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>차곡차곡 · 나의 자산</title>
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="차곡차곡">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261109b">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js?v=20261109b"></script>
</head>
<body>
  <div id="boot" class="boot">불러오는 중…</div>

  <main id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <img src="icon.svg" alt="" width="56" height="56">
      <h1>차곡차곡</h1>
      <p class="fine">나만 보는 자산 관리</p>
      <label class="field"><span>이메일</span><input id="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>비밀번호</span><input id="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="warn" role="alert"></p>
      <button class="btn primary wide" type="submit">로그인</button>
      <a class="fine" href="?demo">예시 데이터로 둘러보기</a>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <header class="top">
      <a class="brand" href="#home"><img src="icon.svg" alt="" width="28" height="28"><span>차곡차곡</span></a>
      <span id="sync" class="sync" aria-live="polite"></span>
    </header>
    <nav id="tabs" class="tabs" aria-label="메뉴">
      <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg><span>대시보드</span></a>
      <a href="#assets" data-tab="assets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5M5 9.5V20h14V9.5M10 20v-5h4v5"/></svg><span>자산</span></a>
      <a href="#debts" data-tab="debts"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>부채</span></a>
      <a href="#records" data-tab="records"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>기록</span></a>
      <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>설정</span></a>
    </nav>
    <main id="view" class="view"></main>
  </div>

  <dialog id="editor">
    <form id="editor-form">
      <h2 id="editor-title"></h2>
      <div id="editor-fields"></div>
      <div class="dialog-actions">
        <button type="button" id="editor-delete" class="btn danger">삭제</button>
        <span class="spacer"></span>
        <button type="button" id="editor-cancel" class="btn ghost">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
